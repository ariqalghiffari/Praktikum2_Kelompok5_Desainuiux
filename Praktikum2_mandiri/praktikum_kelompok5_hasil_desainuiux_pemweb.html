<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Generate Link - Form Hasil Pemesanan Barang</title>
</head>
<body>
    <p align="center">
        <a href="/Praktikum UIUX 2/Praktikum2_mandiri/praktikum2_kelompok5_desainuiux_pemweb.html">Home</a> | 
        <a href="#">Register</a> | 
        <a href="#">Policy</a> | 
        <a href="#">About</a>
    </p>
    <hr>
        <table border="0" cellpadding="5" cellspacing="0" width="100%">
            <tr>
                <td width="30%" valign="top" align="center">
                    <figure>
                        <img src="/Praktikum UIUX 2/assets/img/googlepixel.png" alt="Google Pixel 11 Pro" width="200" height="150" border="1">
                    </figure>
                </td>
                <td width="70%" valign="top">
                    <table border="0" cellpadding="4">
                        <tr>
                            <td><label for="title">Title Here</label></td>
                            <td>: <input type="text" id="title" name="title" value="Google Pixel 11 Pro" size="30"></td>
                        </tr>
                        <tr>
                            <td valign="top"><label for="description">Description</label></td>
                            <td>: 
                                <textarea id="description" name="description" rows="4" cols="30">
                                    Year : 2026
                                    Model : Smartphone
                                    Condition : New
                                </textarea>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="total_amount">Total Amount</label></td>
                            <td>: <input type="text" id="total_amount" name="total_amount" value="£800" size="30"></td>
                        </tr>
                        <tr>
                            <td><label for="pay_to">Pay to</label></td>
                            <td>: <input type="text" id="pay_to" name="pay_to" value="123-456-789-0" size="30"></td>
                        </tr>
                        <tr>
                            <td><label for="payment_type">Payment Type</label></td>
                            <td>: 
                                <select id="payment_type" name="payment_type">
                                    <option value="Visa Debit" selected>Visa Debit</option>
                                    <option value="MasterCard">MasterCard</option>
                                    <option value="Credit Card">Credit Card</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="account_holder">Account Holder</label></td>
                            <td>: <input type="text" id="account_holder" name="account_holder" value="Name Here" size="30"></td>
                        </tr>
                        <tr>
                            <td><label for="account_no">Account No</label></td>
                            <td>: <input type="text" id="account_no" name="account_no" value="123-456-789-0" size="30"></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <input type="checkbox" id="chk_mobile" name="send_mobile" checked>
                                <label for="chk_mobile">Send to Mobile Phone</label>
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td>
                                <input type="checkbox" id="chk_email" name="send_email" checked>
                                <label for="chk_email">Email me copy of transaction</label>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="mobile_phone">Send to Mobile Phone</label></td>
                            <td>: <input type="text" id="mobile_phone" name="mobile_phone" value="089530824879" size="30"></td>
                        </tr>
                        <tr>
                            <td><label for="email">Send to Email</label></td>
                            <td>: <input type="text" id="email" name="email" value="ariqalghiffari7@gmail.com" size="30"></td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <br>
                    <input type="submit" value="Pay using QuadPay">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
